name: Deploy SyllabiQ to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository via native Git
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: Install dependencies
        run: |
          node -v
          npm -v
          npm install --no-audit --no-fund --legacy-peer-deps || (
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const sec of ["dependencies", "devDependencies"]) {
                if (!pkg[sec]) continue;
                for (const k of Object.keys(pkg[sec])) {
                  pkg[sec][k] = "latest";
                }
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            ' && npm install --no-audit --no-fund --legacy-peer-deps
          )

      - name: Build static web application
        run: |
          npm run build
          cp public/404.html dist/404.html || cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy build artifact to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy SyllabiQ web app to GitHub Pages"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:refs/heads/gh-pages

      - name: Configure GitHub Pages source branch
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
